services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adaptive
      POSTGRES_USER: adaptive
      POSTGRES_PASSWORD: adaptive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptive -d adaptive"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - adaptive_postgres_data:/var/lib/postgresql/data

volumes:
  adaptive_postgres_data:

