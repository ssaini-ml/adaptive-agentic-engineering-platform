name: V0.1 Release Evidence Gate

on:
  push:
    tags:
      - "v0.1.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-review-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python evaluation/check_review_complete.py
