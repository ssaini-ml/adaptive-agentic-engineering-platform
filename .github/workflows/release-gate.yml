name: V0.1 Release Gate

on:
  push:
    tags:
      - "v0.1*"
  workflow_dispatch:

jobs:
  human-review-complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python evaluation/check_review_complete.py
